app_id: org.nimiplatform.deeptutor
display_name: DeepTutor
version: 1.6.17
profile: standalone
manifest_role: submitted-input
metadata:
  summary: A learning workspace for studying documents, solving problems and writing notes, using Nimi for AI models.
  icon: assets/nimi-app-icon.png
  readme: README.nimi.md
  release_notes: NIMI_RELEASE_NOTES.md
app_access:
  - runtime.consume
capability_contract_refs:
  - text.generate
  - text.embed
  - audio.synthesize
  - audio.transcribe
  - image.generate
  - video.generate
required_standardized_feature_refs: []
storage_policy:
  kind: app-owned-os-storage
  os_storage_disclosure:
    - path_pattern: <Nimi data root>/app-hosts/*/apps/*/user-data/workspace/**
      purpose: Desktop-prepared Host workspace on Windows and macOS for learning sessions, uploaded materials, retrieval indexes, notebooks, App settings and logs
      expected_size_band: 100 MiB–20 GiB, depending on imported materials
local_development:
  electron:
    renderer_origin: http://127.0.0.1:1467
    host_source_directory: electron
safety_profile:
  intended_audience: general
  content_descriptors:
    - unmoderated-shared-content
  ai:
    direct_interaction: true
    interaction_notice: absent
    risk_features: []
    subject_notice: not-applicable
    outputs:
      - modality: text
        exposure: publishable
        publication_control: automatic
        in_product_notice: absent
        export_visible_marking: absent
        machine_readable_marking: absent
      - modality: image
        exposure: exportable
        publication_control: not-applicable
        in_product_notice: absent
        export_visible_marking: absent
        machine_readable_marking: absent
      - modality: audio
        exposure: exportable
        publication_control: not-applicable
        in_product_notice: absent
        export_visible_marking: absent
        machine_readable_marking: absent
      - modality: video
        exposure: exportable
        publication_control: not-applicable
        in_product_notice: absent
        export_visible_marking: absent
        machine_readable_marking: absent
  data_practices:
    publisher_direct_external_network: true
    telemetry: []
    third_party_account: optional
    user_content_sharing: public
    commercial_features: []
    sensitive_data_categories: []
  high_impact_decision_uses: []
