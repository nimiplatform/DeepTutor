<svg xmlns="http://www.w3.org/2000/svg" width="575" height="575" viewBox="0 0 575 575"><title>Windows contrast variant</title><!-- Original artwork is unchanged. A flat edge keeps its silhouette legible on light and dark Windows surfaces; this is not Home artwork. --><defs><filter id="contrast" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB"><feMorphology in="SourceAlpha" operator="dilate" radius="6" result="edge"/><feFlood flood-color="#20344B"/><feComposite in2="edge" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><image width="575" height="575" href="../nimi-app-icon.png" filter="url(#contrast)"/></svg>
