build_profile_ref: electron-pnpm
profile_role: developer-workflow-input
test_command: pnpm run test:app
build_command: pnpm run build:electron:production
targets:
  windows-x86_64:
    os: windows
    arch: x86_64
    payload_path: dist-electron-package/deeptutor-shell-win32-x64
    runtime_entry: payload/deeptutor-shell.exe
  macos-aarch64:
    os: macos
    arch: arm64
    payload_path: dist-electron-package/deeptutor-shell-darwin-arm64
    runtime_entry: payload/deeptutor-shell.app/Contents/MacOS/deeptutor-shell
