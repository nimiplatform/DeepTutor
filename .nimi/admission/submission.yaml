app_id: org.nimiplatform.deeptutor
display_name: DeepTutor
version: 1.6.16
profile: standalone
npm_package_name: nimiapp-deeptutor
cargo_package_name: nimiapp-deeptutor-shell
tauri_identifier: ai.nimi.apps.org.nimiplatform.deeptutor
package_author: DeepTutor contributors
submission_role: developer-submitted-input
capability_contract_refs:
  - text.generate
  - text.embed
  - audio.synthesize
  - audio.transcribe
  - image.generate
  - video.generate
required_standardized_feature_refs: []
storage_policy:
  kind: app-owned-os-storage
  os_storage_disclosure:
    - path_pattern: <Nimi data root>/app-hosts/*/apps/*/user-data/workspace/**
      purpose: Desktop-prepared Host workspace on Windows and macOS for learning sessions, uploaded materials, retrieval indexes, notebooks, App settings and logs
      expected_size_band: 100 MiB–20 GiB, depending on imported materials
safety_profile:
  ai:
    direct_interaction: true
    interaction_notice: absent
    outputs:
      - export_visible_marking: absent
        exposure: publishable
        in_product_notice: absent
        machine_readable_marking: absent
        modality: text
        publication_control: automatic
      - export_visible_marking: absent
        exposure: exportable
        in_product_notice: absent
        machine_readable_marking: absent
        modality: image
        publication_control: not-applicable
      - export_visible_marking: absent
        exposure: exportable
        in_product_notice: absent
        machine_readable_marking: absent
        modality: audio
        publication_control: not-applicable
      - export_visible_marking: absent
        exposure: exportable
        in_product_notice: absent
        machine_readable_marking: absent
        modality: video
        publication_control: not-applicable
    risk_features: []
    subject_notice: not-applicable
  content_descriptors:
    - unmoderated-shared-content
  data_practices:
    commercial_features: []
    publisher_direct_external_network: true
    sensitive_data_categories: []
    telemetry: []
    third_party_account: optional
    user_content_sharing: public
  high_impact_decision_uses: []
  intended_audience: general
support_manifest:
  diagnostics_bundle_fields:
    - app_version
    - runtime_status
  redaction_rules:
    - credentials
  user_visible_issue_categories:
    - startup
    - runtime
  escalation_path: README.md#support
  kill_switch_visibility: visible
  recovery_instructions: Restart the App from Nimi. If the problem persists, reinstall the current admitted release.
review_inputs:
  manifest: nimi.app.yaml
  build_profile: .nimi/config/build-profile.yaml
  scaffold_boundary: .nimi/contracts/scaffold-boundary.yaml
admission_truth: platform-owned-after-review
